name: Release

# Changesets-driven release workflow.
#
# On every push to main, this workflow will either:
#
#   1. Open or update a "Version Packages" pull request when there are
#      unconsumed .changeset/*.md files.
#
#   2. Publish packages to npm when the Version Packages PR has been merged
#      and the changesets have already been consumed.
#
# Required secrets:
#
#   CHANGESETS_TOKEN
#     Fine-grained GitHub Personal Access Token scoped to this repository.
#     Required repository permissions:
#       - Contents: Read and write
#       - Pull requests: Read and write
#       - Workflows: Read and write
#
#   NPM_TOKEN
#     npm token with publish rights for packages under the @loomi scope.
#
# id-token: write is required for npm provenance.
#
# The CHANGESETS_TOKEN is also supplied to actions/checkout so Git operations
# performed later by changesets/action use the PAT instead of the default
# GitHub Actions token. This is required when the release branch contains
# changes under .github/workflows/.

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    # NPM_TOKEN can be stored in this environment instead of directly as a
    # repository secret. If required reviewers are configured for the
    # environment, publishing will require approval before this job proceeds.
    environment: npm

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
          scope: '@loomidev'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify NPM token
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is missing"
            exit 1
          fi
          echo "NPM_TOKEN is present"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
