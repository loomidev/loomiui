name: Release

# Changesets-driven release. On every push to main, either:
#   - opens/updates a "Version Packages" PR if there are unconsumed .changeset/*.md files, or
#   - publishes to npm (with provenance) if that PR was just merged (i.e. versions were
#     already bumped and the changesets already consumed).
#
# Requires two repo secrets to actually run:
#   NPM_TOKEN   — an npm automation token with publish rights on the @loomi org.
#   (GITHUB_TOKEN is provided automatically by Actions.)
#
# id-token: write is required for npm provenance (--provenance, handled internally by
# the changesets/action + npm CLI when run inside GitHub Actions with OIDC).

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # NPM_TOKEN lives in this environment rather than in repo secrets, so a merge to main
    # cannot publish on its own — the environment's required reviewers must approve the
    # run first. Configure those under Settings → Environments → npm (needs a public repo
    # or a paid plan; until then this line is inert but harmless).
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
