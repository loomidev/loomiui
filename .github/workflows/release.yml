name: Release

# Runs only after CI has gone green on the very commit it is about to release. The two
# workflows used to be independent: Release does `pnpm install` and `pnpm build` and never
# runs the test suite, so the environment approval was the only place a human could notice
# that CI had failed — and npm versions are immutable, so noticing late is not a recovery.
# workflow_dispatch stays as the manual escape hatch when a release has to go out without
# waiting for a fresh CI run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never cancel a release in flight. CI can be interrupted freely — it only recomputes an
# answer — but this job publishes to npm, and npm versions are immutable: a run killed
# part-way through leaves some packages published at the new version and the rest behind,
# with no way to take the published ones back. Queue instead, so a merge that lands during
# a publish waits its turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # A cancelled or failed CI run must not release. Manual dispatch is the deliberate
    # override and carries no CI result to check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN }}
          # The commit CI just verified, not whatever main has drifted to since. On a
          # manual dispatch there is no triggering run, so this falls back to the ref the
          # dispatch was aimed at.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
          scope: "@loomidev"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          # Attribute Version Packages commits to the CHANGESETS_TOKEN owner (the
          # human maintainer), not github-actions[bot]. Avoids Co-authored-by trailers
          # from the bot when those PRs are squash-merged.
          setupGitUser: false
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
          # Publish via npm Trusted Publishing (OIDC). Do not set NODE_AUTH_TOKEN /
          # NPM_TOKEN here — a token forces legacy auth and bypasses OIDC.
