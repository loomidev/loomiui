name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Chrome is downloaded by puppeteer's postinstall script, but it lands in
      # ~/.cache/puppeteer — outside the pnpm store that `cache: pnpm` restores. pnpm skips
      # that script whenever the store cache hits, so a warm store on a fresh runner leaves
      # no browser anywhere and every test file fails to launch with "Could not find Chrome".
      # Cache the browsers on their own key so they travel with the store.
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Covers the remaining gap: a store-cache hit with a cold browser cache still skips the
      # postinstall. Rebuilding forces it to run; once the browsers exist it costs ~2s.
      - name: Ensure Chrome for Puppeteer
        run: pnpm rebuild puppeteer

      # Fast static checks first — cheap to run, fail early before build/test.
      - name: No merge-conflict markers
        run: pnpm check:conflicts
      - name: Bundle packages in sync
        run: pnpm check:bundles
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # Generated custom-elements.json manifests must match their source.
      - name: Component manifests up to date
        run: pnpm check:cem

      # Component quality audit (semantic tokens, a11y expectations, README sections).
      - name: Quality audit
        run: pnpm audit:quality
      - name: README quality sections up to date
        run: pnpm quality:readmes && git diff --exit-code -- packages
