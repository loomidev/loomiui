name: CI

on:
  # main only. A push to development that has an open pull request would otherwise
  # match both triggers and build the same commit twice — ~6 minutes of runner time
  # for a second, identical answer. Work on a branch is covered by its pull request;
  # main is not, which is why it stays here.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # The test suite runs against Chromium, Firefox and WebKit (see
      # web-test-runner.config.mjs). Playwright stores its browsers in ~/.cache/ms-playwright,
      # outside the pnpm store that `cache: pnpm` restores, so cache them on their own key.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Idempotent: with a warm cache this revalidates and exits in seconds. --with-deps
      # installs the system libraries Firefox and WebKit need on a bare runner, which the
      # cache cannot carry.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Fast static checks first — cheap to run, fail early before build/test.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only production dependencies gate CI — dev-only tooling vulnerabilities (build,
      # lint, test infra that never ships to a consumer) are tracked by Dependabot instead
      # of blocking every PR on an upstream tool's unpatched transitive dependency.
      - name: Dependency vulnerability audit
        run: pnpm audit --prod
      - name: No merge-conflict markers
        run: pnpm check:conflicts
      - name: Bundle packages in sync
        run: pnpm check:bundles
      - name: Every component is in the accessibility sweep
        run: pnpm check:a11y-coverage
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check

      - run: pnpm build
      - name: Generated styles up to date
        run: pnpm check:styles
      - name: React type declarations up to date
        run: pnpm check:react-types
      - name: React wrapper components up to date
        run: pnpm check:react
      - run: pnpm typecheck
      # Needs the built dist/, and runs in Node with no DOM — that is the point.
      - name: Components server-render
        run: pnpm check:ssr
      # The other half: that a browser can adopt that markup rather than replace it.
      - name: Server-rendered markup hydrates
        run: pnpm check:hydration
      # Reports per-locale translation coverage against en; only fails on keys that don't
      # exist in en at all (a stale rename or typo) — partial locales are a supported,
      # documented contribution path (see packages/core/src/locales/index.ts).
      - name: Locale completeness
        run: pnpm check:i18n
      - run: pnpm test

      # Baselines are per-platform bitmaps and the Linux set is recorded by the
      # "Visual baselines" workflow. Until it has run and those files are committed there is
      # nothing to compare against, so this step waits rather than failing every pull
      # request — it starts enforcing itself as soon as screenshots/linux/ exists.
      - name: Visual regression
        if: hashFiles('screenshots/linux/**') != ''
        run: pnpm test:visual

      # Generated custom-elements.json manifests must match their source.
      - name: Component manifests up to date
        run: pnpm check:cem

      # Component quality audit (semantic tokens, a11y expectations, README sections).
      - name: Quality audit
        run: pnpm audit:quality
      - name: README quality sections up to date
        run: pnpm quality:readmes && git diff --exit-code -- packages

      # CI notification. Every run on main, and only failures on pull requests — a green
      # PR run is already visible on the PR itself, and posting each one would drown the
      # channel in noise nobody acts on. The webhook is a secret (a bearer credential:
      # holding the URL is enough to post), and a run without it skips rather than fails,
      # so pull requests from forks do not go red over a missing secret.
      - name: Notify Slack
        if: always() && (github.ref_name == 'main' || job.status == 'failure')
        env:
          WEBHOOK: ${{ secrets.SLACK_CI_WEBHOOK }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Quoted, both of them: an unquoted YAML scalar treats " #" as the start of a
          # comment, so `format('PR #{0}', ...)` silently truncated to an unterminated
          # ${{ expression and GitHub refused to load this workflow at all.
          WHERE: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }}"
          TITLE: "${{ github.event.pull_request.title || github.event.head_commit.message }}"
        run: |
          [ -n "$WEBHOOK" ] || { echo "No SLACK_CI_WEBHOOK configured; skipping."; exit 0; }
          case "$STATUS" in
            success) icon=":white_check_mark:" ;;
            cancelled) icon=":black_square_for_stop:" ;;
            *) icon=":x:" ;;
          esac
          # First line only: a commit body would otherwise paste a whole message into chat.
          headline=$(printf '%s' "$TITLE" | head -1)
          jq -n --arg text "$icon *CI $STATUS* on \`$WHERE\` — $headline (<$RUN_URL|run log>)" '{text: $text}' |
            curl -sS --fail-with-body -X POST -H 'Content-type: application/json' --data @- "$WEBHOOK"
