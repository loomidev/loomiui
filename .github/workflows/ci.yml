name: CI

on:
  # main only. A push to development that has an open pull request would otherwise
  # match both triggers and build the same commit twice — ~6 minutes of runner time
  # for a second, identical answer. Work on a branch is covered by its pull request;
  # main is not, which is why it stays here.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The test suite runs against Chromium, Firefox and WebKit (see
      # web-test-runner.config.mjs). Playwright stores its browsers in ~/.cache/ms-playwright,
      # outside the pnpm store that `cache: pnpm` restores, so cache them on their own key.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Idempotent: with a warm cache this revalidates and exits in seconds. --with-deps
      # installs the system libraries Firefox and WebKit need on a bare runner, which the
      # cache cannot carry.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Fast static checks first — cheap to run, fail early before build/test.
      - name: No merge-conflict markers
        run: pnpm check:conflicts
      - name: Bundle packages in sync
        run: pnpm check:bundles
      - name: Every component is in the accessibility sweep
        run: pnpm check:a11y-coverage
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check

      - run: pnpm build
      - name: Generated styles up to date
        run: pnpm check:styles
      - name: React type declarations up to date
        run: pnpm check:react-types
      - name: React wrapper components up to date
        run: pnpm check:react
      - run: pnpm typecheck
      # Needs the built dist/, and runs in Node with no DOM — that is the point.
      - name: Components server-render
        run: pnpm check:ssr
      # The other half: that a browser can adopt that markup rather than replace it.
      - name: Server-rendered markup hydrates
        run: pnpm check:hydration
      - run: pnpm test

      # Baselines are per-platform bitmaps and the Linux set is recorded by the
      # "Visual baselines" workflow. Until it has run and those files are committed there is
      # nothing to compare against, so this step waits rather than failing every pull
      # request — it starts enforcing itself as soon as screenshots/linux/ exists.
      - name: Visual regression
        if: hashFiles('screenshots/linux/**') != ''
        run: pnpm test:visual

      # Generated custom-elements.json manifests must match their source.
      - name: Component manifests up to date
        run: pnpm check:cem

      # Component quality audit (semantic tokens, a11y expectations, README sections).
      - name: Quality audit
        run: pnpm audit:quality
      - name: README quality sections up to date
        run: pnpm quality:readmes && git diff --exit-code -- packages
