name: Feature request
description: Suggest a new component, a new attribute on an existing one, or another improvement.
labels: ["enhancement"]
body:
  - type: input
    id: package
    attributes:
      label: Related package (if any)
      description: Leave blank if this is a request for a brand-new component.
      placeholder: "@loomidev/select"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case — what are you trying to build that loomi doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: |
        If you have one in mind, sketch the attribute(s)/event(s) you'd expect, e.g.:
        `<loomi-select multiple max-selectable="3">`
      render: html
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: release
    attributes:
      label: Target release
      description: Select Unscheduled when this request has not yet been assigned to the roadmap.
      options:
        - Unscheduled
        - v0.1 Foundation
        - v0.2 Core Platform
        - v0.3 Alpha
        - v0.4 Beta
        - v0.5 Release Candidate
        - v1.0 Production
        - v1.1 Enhancements
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Roadmap area
      options:
        - Frontend
        - Design System
        - Accessibility
        - Localization
        - Testing
        - Build Tooling
        - Developer Experience
        - Documentation
        - Security
        - Infrastructure
        - Analytics
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
