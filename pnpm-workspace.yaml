packages:
  - "packages/*"
linkWorkspacePackages: true
preferWorkspacePackages: true
autoInstallPeers: true
strictPeerDependencies: false
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  puppeteer: true

# Security advisories in transitive dependencies whose parents have not yet
# released a bump. Drop an entry once the parent dependency ships the fix.
overrides:
  hono: ^4.12.34
  fast-uri: ^3.1.5
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  ip-address: ^10.3.1
