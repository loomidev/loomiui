title = "loomiui gitleaks config"

# Start from gitleaks' built-in rule set; add [[allowlist]] entries below (by path or
# regex) only for confirmed false positives — a test fixture or documentation example —
# never to silence a real finding. See SECURITY.md for the incident procedure.
[extend]
useDefault = true

[allowlist]
description = "Test fixture colors, placeholder credentials, and generated hashes that trip the generic-api-key heuristic"
paths = [
  '''packages/colorpicker/test/.*''',
  '''packages/forms/test/form-reset\.test\.ts''',
  # Content-hash manifest keyed by package name — "password" is a component name here,
  # not a credential, and the values are SHA-256 hashes, not secrets.
  '''scripts/generated-styles-manifest\.json''',
  # Prose refers to CSS custom properties as "public/private tokens" (e.g.
  # `--_loomi-primary-600-default`), which the generic-api-key rule mistakes for a secret.
  # (lived at repo root as architecture.md before it moved under docs/)
  '''(docs/)?architecture\.md''',
]
